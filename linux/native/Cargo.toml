[package]
name = "pomocli-desktop"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
default = []
dialogs = ["dep:gtk4"]

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
ksni = "0.3.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
gtk4 = { version = "0.9", optional = true }

[[bin]]
name = "pomo-tray"
path = "src/bin/pomo-tray.rs"

[[bin]]
name = "pomo-dialog"
path = "src/bin/pomo-dialog.rs"
required-features = ["dialogs"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
